name: GitHub Trending Daily Push

on:
  schedule:
    - cron: "0 0 * * *"   # UTC 00:00 = 北京时间 08:00
  workflow_dispatch:

# 允许 Actions 写回 state.json（排名历史持久化）
permissions:
  contents: write

jobs:
  send-trending:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run trending bot
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python trending.py

      # 把 state.json 提交回仓库，实现排名历史持久化
      - name: Save state to repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || \
            git commit -m "chore: update trending state $(date +%Y-%m-%d) [skip ci]"
          git push
